services:
  - type: web
    name: f1-intelli-api
    env: docker
    dockerfilePath: ./app/backend/Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: f1-intelli-api-data
      mountPath: /opt/render/project/src/app/backend/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOCAL_TIMEZONE
        value: America/Los_Angeles
      - key: OPENF1_BASE_URL
        value: https://api.openf1.org/v1
      - key: PREDICTION_ENABLE_LIVE_TRAINING
        value: false
      - key: PREDICTION_HTTP_TIMEOUT_SECONDS
        value: 8

  - type: web
    name: f1-intelli-web
    env: docker
    dockerfilePath: ./app/frontend/Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: f1-intelli-api
          property: url
